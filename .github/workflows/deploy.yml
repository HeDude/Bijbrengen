name: Deploy Bijbrengen

permissions:
  id-token: write
  contents: read

on:
  push:
    branches:
      - master
    paths:
      - landing-site/**
      - package.json
      - package-lock.json

  pull_request:
    branches:
      - master
    paths:
      - landing-site/**
      - package.json
      - package-lock.json

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro app
        run: npm run build:landing

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: astro-app
          path: landing-site/dist

  test-deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: astro-app
          path: astro-app

      - name: Configure AWS CLI
        uses: aws-actions/configure-aws-credentials@v4
        with:
          audience: sts.amazonaws.com
          aws-region: eu-west-1
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Deploy to Test S3 Bucket
        run: |
          aws s3 sync astro-app/ s3://www.test.bijbrengen.nl \
            --delete

          echo "Test deployment complete."

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.BIJBRENGEN_TEST_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

  production-deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: astro-app
          path: astro-app

      - name: Configure AWS CLI
        uses: aws-actions/configure-aws-credentials@v4
        with:
          audience: sts.amazonaws.com
          aws-region: eu-west-1
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Deploy to Production S3 Bucket
        run: |
          aws s3 sync astro-app/ s3://www.bijbrengen.nl \
            --delete

          echo "Production deployment complete."

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.BIJBRENGEN_PRD_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
